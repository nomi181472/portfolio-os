<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" class="cb-widget">
  <style>
    /* Default / Dark Appearance (Obsidian substrate + Silver luminescent signal) */
    .cb-widget {
      --c1: #111318;
      --c2: #f5f7fa;
      --c-border: rgba(255, 255, 255, 0.15);
      --pulse: rgba(255, 255, 255, 0.25);
    }
    /* Light Appearance */
    @media (prefers-color-scheme: light) {
      .cb-widget {
        --c1: #ffffff;
        --c2: #090a0d;
        --c-border: rgba(9, 10, 13, 0.15);
        --pulse: rgba(9, 10, 13, 0.15);
      }
    }
  </style>

  <defs>
    <!-- Gradient for the highlight sweep -->
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="var(--c2)" stop-opacity="0"/>
      <stop offset="45%"  stop-color="var(--c2)" stop-opacity="0"/>
      <stop offset="50%"  stop-color="var(--c2)" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="var(--c2)" stop-opacity="0"/>
      <stop offset="100%" stop-color="var(--c2)" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft glow for eyes -->
    <filter id="eyeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip so highlight stays inside the circle -->
    <clipPath id="circleClip">
      <circle cx="60" cy="60" r="54"/>
    </clipPath>
  </defs>

  <!-- ─── Outer pulse rings (breathing highlight) ─── -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="var(--pulse)" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="54;70;70" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="54" fill="none" stroke="var(--pulse)" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="54;70;70" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="54" fill="none" stroke="var(--pulse)" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="54;70;70" dur="2.6s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0" dur="2.6s" begin="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- ─── Main circle base ─── -->
  <circle cx="60" cy="60" r="53" fill="var(--c1)" stroke="var(--c-border)" stroke-width="2"/>

  <!-- ─── Rotating highlight sweep across the circle ─── -->
  <g clip-path="url(#circleClip)">
    <rect x="-30" y="-30" width="180" height="180" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="rotate"
        from="0 60 60" to="360 60 60"
        dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ─── Bot Antenna (glowing tip) ─── -->
  <line x1="60" y1="30" x2="60" y2="40"
        stroke="var(--c2)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="60" cy="27" r="3.5" fill="var(--c2)" filter="url(#eyeGlow)">
    <animate attributeName="r" values="3.5;5;3.5" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- ─── Bot Head ─── -->
  <rect x="33" y="40" width="54" height="44" rx="16"
        fill="none" stroke="var(--c2)" stroke-width="2.5"/>

  <!-- ─── Eyes (glowing + blinking + moving) ─── -->
  <!-- LEFT EYE -->
  <g filter="url(#eyeGlow)">
    <ellipse cx="49" cy="58" rx="6" ry="6" fill="var(--c2)">
      <!-- Blink -->
      <animate attributeName="ry" values="6;6;0;0;6;6"
        dur="3.8s" repeatCount="indefinite"
        keyTimes="0;0.85;0.9;0.95;0.98;1"/>
    </ellipse>
    <!-- Pupil -->
    <circle cx="49" cy="58" r="2.4" fill="var(--c1)">
      <animate attributeName="cx" values="49;50.5;47.5;49" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="58;57.5;58.5;58" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- RIGHT EYE -->
  <g filter="url(#eyeGlow)">
    <ellipse cx="71" cy="58" rx="6" ry="6" fill="var(--c2)">
      <animate attributeName="ry" values="6;6;0;0;6;6"
        dur="3.8s" repeatCount="indefinite"
        keyTimes="0;0.85;0.9;0.95;0.98;1"/>
    </ellipse>
    <circle cx="71" cy="58" r="2.4" fill="var(--c1)">
      <animate attributeName="cx" values="71;72.5;69.5;71" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="58;57.5;58.5;58" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ─── Smiling mouth (talking) ─── -->
  <path d="M50 74 Q60 80 70 74"
        fill="none" stroke="var(--c2)" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="d"
      values="M50 74 Q60 80 70 74; M50 75 Q60 72 70 75; M50 74 Q60 80 70 74"
      dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- ─── Cheek lights (glowing) ─── -->
  <circle cx="40" cy="68" r="2.5" fill="var(--c2)" filter="url(#eyeGlow)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="68" r="2.5" fill="var(--c2)" filter="url(#eyeGlow)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- ─── Orbiting highlight dots ─── -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      from="0 60 60" to="360 60 60" dur="8s" repeatCount="indefinite"/>
    <circle cx="60" cy="14" r="2" fill="var(--c2)" opacity="0.9" filter="url(#eyeGlow)"/>
    <circle cx="60" cy="106" r="1.5" fill="var(--c2)" opacity="0.5"/>
  </g>

  <!-- ─── Notification badge ─── -->
  <g>
    <circle cx="95" cy="25" r="11" fill="var(--c2)" stroke="var(--c1)" stroke-width="2">
      <animate attributeName="r" values="11;12;11" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="95" y="30" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="12" font-weight="700" fill="var(--c1)">1</text>
    <!-- Badge ping -->
    <circle cx="95" cy="25" r="11" fill="none" stroke="var(--c2)" stroke-width="1.5" opacity="0.8">
      <animate attributeName="r" values="11;18;18" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>